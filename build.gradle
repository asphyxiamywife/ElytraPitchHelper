plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.gradle.userdev' version "${neogradle_version}" apply false
}

def snapshotBuild = providers.gradleProperty("snapshotBuild")
        .map { it.equalsIgnoreCase("true") }
        .orElse(false)
def actionsCommit = providers.environmentVariable("GITHUB_SHA")
        .map { it.take(7) }
        .orElse("")
if (snapshotBuild.get() && actionsCommit.get().isBlank()) {
    logger.warn("snapshotBuild=true but GITHUB_SHA is unset; building release version " +
            "${project.mod_version} instead of a snapshot.")
}
def resolvedVersion = snapshotBuild.get() && !actionsCommit.get().isBlank()
        ? "${project.mod_version}.actions.${actionsCommit.get()}"
        : project.mod_version

allprojects {
    version = resolvedVersion
    group = rootProject.maven_group
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
    }

    tasks.withType(ProcessResources).configureEach {
        exclude "**/.DS_Store"
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(25)
            sourceCompatibility = JavaVersion.VERSION_25
            targetCompatibility = JavaVersion.VERSION_25
        }
    }
}

tasks.register("smokeTest") {
    description = "Runs headless smoke tests for packaged entrypoints and client config startup."
    group = "verification"
    if (findProject(":fabric") != null) {
        dependsOn ":fabric:smokeTest"
    }
    if (findProject(":neoforge") != null) {
        dependsOn ":neoforge:smokeTest"
    }
}

tasks.register("fuzz") {
    description = "Runs all fuzz targets for their configured durations."
    group = "verification"
    dependsOn ":common:fuzz"
}

tasks.register("check") {
    description = "Runs verification for the included loader modules."
    group = "verification"
    dependsOn ":common:check"
    if (findProject(":fabric") != null) {
        dependsOn ":fabric:check"
    }
    if (findProject(":neoforge") != null) {
        dependsOn ":neoforge:check"
    }
}

tasks.register("buildFabric") {
    description = "Builds only the Fabric loader module and its shared common code."
    group = "build"
    dependsOn ":fabric:build"
}

tasks.register("buildNeoForge") {
    description = "Builds only the NeoForge loader module and its shared common code."
    group = "build"
    dependsOn ":neoforge:build"
}

def probeAcceptRequested = providers.gradleProperty('acceptGoldens').isPresent()
def probeMinecraftVersion = minecraft_version.toString()
tasks.register('probeAcceptanceGuard') {
    mustRunAfter ':portCertificateReadOnlyGuard'
    doLast {
        if (probeAcceptRequested && probeMinecraftVersion == '26.1.2') {
            throw new GradleException('Cannot accept goldens for reference version 26.1.2. Reference goldens are immutable.')
        }
    }
}
tasks.register('clearProbeSummary', Delete) {
    dependsOn ':probeAcceptanceGuard'
    delete layout.buildDirectory.file('reports/port-cert/probe-summary.json')
}
tasks.register('portCertProbe') {
    description = 'Verifies real-engine observation contracts and Fabric/NeoForge parity.'
    group = 'verification'
    dependsOn ':common:verifyProbeObservations'
}

tasks.register('portCertificateReadOnlyGuard') {
    doLast {
        if (probeAcceptRequested) throw new GradleException('portCert is read-only. Use portCertProbe -PacceptGoldens for explicit non-reference promotion.')
    }
}
tasks.register('clearClientSummary', Delete) {
    dependsOn ':probeAcceptanceGuard'
    delete layout.buildDirectory.file('reports/port-cert/client/summary.json')
}
tasks.register('portCertClient') {
    description = 'Verifies actual client boot, HUD drawing, mixins and LocalPlayer capture on both loaders.'
    group = 'verification'
    dependsOn ':common:verifyClientObservations'
}
tasks.register('portCert') {
    description = 'Read-only certificate of server-safe capture, model semantics, engine parity and client integration.'
    group = 'verification'
    dependsOn ':portCertificateReadOnlyGuard', ':common:portCertBoundary', ':common:portCertModel', ':portCertProbe', ':portCertClient'
    doLast {
        logger.lifecycle('Port contract: PASS — boundary (A), EPH model (B), engine/loader parity (C), client integration (D).')
    }
}
