name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: [self-hosted, macOS, x64]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: check runner prerequisites
        run: |
          export PATH="/opt/local/bin:$PATH"
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          if ! command -v gh >/dev/null 2>&1; then
            echo "Install GitHub CLI on the runner (sudo port install gh) or make an existing installation available on the runner service PATH." >&2
            exit 1
          fi

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          architecture: x64

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
            cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: validate release tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" != v* ]]; then
            echo "Release tag must start with 'v': $TAG_NAME" >&2
            exit 1
          fi

          tag_version="${TAG_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ -z "$mod_version" || "$tag_version" != "$mod_version" ]]; then
            echo "Release tag $TAG_NAME does not match gradle.properties mod_version=$mod_version" >&2
            exit 1
          fi

      - name: build
        # run: ./gradlew --non-interactive build -Ploaders=all
        run: ./gradlew --non-interactive --no-daemon clean check buildFabric -Ploaders=fabric

      - name: locate release jars
        id: jars
        shell: bash
        run: |
          locate_loader_jar() {
            local loader="$1"
            local output_name="${loader}_path"
            local output_dir="${loader}/build/libs"
            local jars=()

            while IFS= read -r jar; do
              jars+=("$jar")
            done < <(find "$output_dir" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort)
            if [[ ${#jars[@]} -ne 1 ]]; then
              printf 'Expected exactly one %s release jar in %s, found %s:\n' "$loader" "$output_dir" "${#jars[@]}" >&2
              printf '%s\n' "${jars[@]}" >&2
              exit 1
            fi

            echo "${output_name}=${jars[0]}" >> "$GITHUB_OUTPUT"
          }

          locate_loader_jar fabric
          # locate_loader_jar neoforge

      - name: attest Fabric release jar
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.jars.outputs.fabric_path }}

      # - name: attest NeoForge release jar
      #   uses: actions/attest@v4
      #   with:
      #     subject-path: ${{ steps.jars.outputs.neoforge_path }}

      - name: create release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          FABRIC_JAR: ${{ steps.jars.outputs.fabric_path }}
          # NEOFORGE_JAR: ${{ steps.jars.outputs.neoforge_path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to update a release asset." >&2
            exit 1
          fi

          gh release create "$TAG_NAME" "$FABRIC_JAR" \
            --draft \
            --verify-tag \
            --title "Release $TAG_NAME" \
            --generate-notes

          gh release edit "$TAG_NAME" --draft=false
