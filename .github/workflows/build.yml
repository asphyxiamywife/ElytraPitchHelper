# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
            cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew --non-interactive build -Ploaders=all -PsnapshotBuild=true
      - name: install headless client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libvulkan1 mesa-vulkan-drivers libflite1
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          if [[ -z "$lavapipe_icd" ]]; then
            echo "Mesa lavapipe Vulkan ICD was not installed" >&2
            exit 1
          fi
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$lavapipe_icd" >> "$GITHUB_ENV"
      - name: certify Minecraft port contracts
        run: >-
          xvfb-run -a -s "-screen 0 1280x720x24 -ac +extension GLX +render -noreset"
          ./gradlew --non-interactive portCert
          -Ploaders=all -PsnapshotBuild=true --max-workers=1
      - name: upload port diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-contract-diagnostics
          path: |
            build/reports/port-cert/
            common/build/reports/port-cert/
            common/build/reports/tests/portCertModel/
            fabric/build/run/probe/logs/
            neoforge/build/run/probe/logs/
            fabric/build/run/clientProbe/logs/
            neoforge/build/run/clientProbe/logs/
          if-no-files-found: ignore
      - name: locate mod jars
        id: jars
        shell: bash
        run: |
          locate_loader_jar() {
            local loader="$1"
            local output_dir="${loader}/build/libs"
            local jars=()

            mapfile -t jars < <(find "$output_dir" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | sort)
            if [[ ${#jars[@]} -ne 1 ]]; then
              printf 'Expected exactly one %s mod jar in %s, found %s:\n' "$loader" "$output_dir" "${#jars[@]}" >&2
              printf '%s\n' "${jars[@]}" >&2
              exit 1
            fi

            echo "${loader}_path=${jars[0]}" >> "$GITHUB_OUTPUT"
          }

          locate_loader_jar fabric
          locate_loader_jar neoforge
      - name: upload Fabric mod jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.fabric_path }}
          archive: false
      - name: upload NeoForge mod jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.neoforge_path }}
          archive: false
